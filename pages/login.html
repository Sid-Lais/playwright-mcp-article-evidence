<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Login</title></head>
<body>
<header><nav aria-label="Main"><a href="/">Home</a> <a href="/help">Help</a></nav></header>
<main>
  <h1>Sign in</h1>
  <form aria-label="Sign in form">
    <label for="email">Email</label>
    <input id="email" type="email" name="email">
    <label for="password">Password</label>
    <input id="password" type="password" name="password">
    <label><input type="checkbox" name="remember"> Remember me</label>
    <button type="submit">Sign in</button>
    <a href="/forgot">Forgot password?</a>
  </form>
  <p>No account? <a href="/signup">Create one</a></p>
</main>
<footer><a href="/terms">Terms</a> <a href="/privacy">Privacy</a></footer>
</body></html>
